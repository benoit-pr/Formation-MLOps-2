name: Python package
on:
  push:
  pull_request:
    branches: [ dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run Linter
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest tests/test_unit
      - name: Run functional tests
        run: uv run behave tests/test_functional/features/
      - name: Lint code with ruff
        run: uv run ruff check --output-format=github
      - name: Run tests
        run: uv run pytest tests/test_architecture

  qualite:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name : qualité
        run: uv run pytest --cov=formation_mlops_2/ tests/test_unit/ -vv -p no:warnings
      - name: pyramide
        run: bash tests/tests_pyramid.sh

